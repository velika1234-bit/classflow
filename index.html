<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрониките на цар Симеон - Златният век</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Philosopher', sans-serif; background-color: #1a0f0a; color: #3d2b1f; }
        .serif { font-family: 'Playfair Display', serif; }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .parchment {
            background-color: #f4e4bc;
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            box-shadow: inset 0 0 100px rgba(139, 69, 19, 0.2);
        }

        .medieval-border {
            border: 20px solid transparent;
            border-image: url('https://www.transparenttextures.com/patterns/iron-grip.png') 30 stretch;
            outline: 4px solid #d4af37;
            outline-offset: -12px;
        }

        .portrait-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(15%) contrast(105%);
        }

        .option-btn {
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #8b4513;
            color: #3d2b1f;
        }
        
        .option-btn:hover {
            background-color: #8b4513 !important;
            color: #f4e4bc !important;
            transform: translateY(-2px);
        }

        .feedback-card {
            background: #2d1b10;
            border: 4px double #d4af37;
            color: #f4e4bc;
        }

        .map-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://chervenibogove.wordpress.com/wp-content/uploads/2018/01/karta-bulgaria-car-simeon-veliki.jpg');
            background-size: cover;
            background-position: center;
        }

        #content::-webkit-scrollbar { width: 8px; }
        #content::-webkit-scrollbar-thumb { background: #8b4513; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <div id="game-container" class="w-full max-w-5xl bg-[#f4e4bc] sm:rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden border-[12px] border-[#3d2b1f] flex flex-col h-screen sm:h-[90vh] relative">
        
        <div class="bg-[#2d1b10] text-[#d4af37] p-4 text-center border-b-4 border-[#d4af37] z-10">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-[0.2em] uppercase serif">Хрониките на Симеонъ</h1>
            <p id="player-display" class="text-amber-200 text-[10px] sm:text-xs mt-1 font-medium hidden uppercase tracking-[0.3em]"></p>
        </div>

        <div id="content" class="flex-grow overflow-y-auto z-0 parchment">
            <!-- Content Loads Here -->
        </div>
    </div>

    <script>
        const CASES = [
            {
                year: "893 г.", title: "Преславскиятъ съборъ",
                description: "Князъ Борисъ I свиква съборъ. Трябва да решите кой езикъ ще бъде официаленъ за църквата и държавата.",
                imageUrl: "https://static.petel.bg/resources/2018/09/11/medium_590.jpg",
                imageAlt: "[Преславският събор]",
                source: "„И пренесоха престола от Плиска в Преслав...“",
                options: [
                    { text: "Обявявамъ славянския езикъ за официаленъ.", impacts: { military: 0, culture: 30, stability: 15 }, feedback: "Славянската писменост става държавна. Византийското влияние намалява значително." },
                    { text: "Запазвамъ старите традиции.", impacts: { military: 5, culture: -20, stability: -10 }, feedback: "Болярите са доволни, но България остава в сянката на гръцката култура." }
                ]
            },
            {
                year: "894 г.", title: "Търговската провокация",
                description: "Византия мести пазара за български стоки в Солун. Това е икономически удар.",
                imageUrl: "https://www.pomorie.bg/new/wp-content/uploads/2018/08/maxresdefault-e1534491826929.jpg",
                imageAlt: "[Българска конница]",
                source: "„Князът не изтърпя това и вдигна меча срещу ромеите.“",
                options: [
                    { text: "Нападамъ ромеите веднага.", impacts: { military: 20, culture: 0, stability: -5 }, feedback: "Печелите бърза победа, но Византия подтиква маджарите към съюз." },
                    { text: "Търся дипломатически изходъ.", impacts: { military: -10, culture: 5, stability: 10 }, feedback: "Дипломацията се проваля, а Византия вижда слабост." }
                ]
            },
            {
                year: "896 г.", title: "Битката при Булгарофигонъ",
                description: "Маджарите са отблъснати. Време е за решителен сблъсък с император Лъв VI.",
                imageUrl: "https://historyofbg.com/uploads/battle/bitkata-pri-bulgarofigon1.jpg",
                imageAlt: "[Битката при Булгарофигон]",
                source: "„Ромеите бяха напълно разбити и побягнаха в ужас.“",
                options: [
                    { text: "Налагамъ ежегоденъ данъкъ на Византия.", impacts: { military: 15, culture: 0, stability: 20 }, feedback: "Византия признава силата на България." },
                    { text: "Обсаждамъ Константинополъ веднага.", impacts: { military: 10, culture: 0, stability: -15 }, feedback: "Стените са твърде здрави. Армията се изтощава." }
                ]
            },
            {
                year: "904 г.", title: "Договорътъ за границата",
                description: "Византия е слаба. Имате шанс да преместите границата само на 20 км от Солун.",
                imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9tw5TWP_KSKbO4qk22cwYp8cbcgFw6XNHQg&s",
                imageAlt: "[Границата при Наръш]",
                source: "„Границата между българи и ромеи беше забита здраво.“",
                options: [
                    { text: "Заселвамъ нови територии мирно.", impacts: { military: 5, culture: 15, stability: 20 }, feedback: "България получава стратегически излаз на нови морета." },
                    { text: "Искамъ целия Солунъ за България.", impacts: { military: 15, culture: -5, stability: -10 }, feedback: "Предизвиквате нов конфликт." }
                ]
            },
            {
                year: "913 г.", title: "Короната на Царъ",
                description: "Пред стените на Цариград сте. Патриарх Николай Мистик излиза да ви коронясва.",
                imageUrl: "https://www.rodenkrai.bg/sites/default/files/styles/uc_product_full/public/simeon_pred_zarigrad_-_gjudjenov.jpg?itok=gzJ0Ah7W",
                imageAlt: "[Симеон пред Цариград]",
                source: "„Ти си самодържец на българите!“",
                options: [
                    { text: "Приемамъ духовно признание за Царъ.", impacts: { military: 0, culture: 25, stability: 25 }, feedback: "България става Царство. Това е невиждан престиж." },
                    { text: "Искамъ трона на Императора.", impacts: { military: 20, culture: 0, stability: -15 }, feedback: "Византия се заклева да ви унищожи." }
                ]
            },
            {
                year: "917 г.", title: "Ахелой: Битката на века",
                description: "Ромеите събират огромна войска. Сблъсъкът е при река Ахелой.",
                imageUrl: "https://kmeta.bg/wp-content/uploads/2021/08/%D0%91%D0%B8%D1%82%D0%BA%D0%B0%D1%82%D0%B0-%D0%BA%D1%80%D0%B0%D0%B9-%D0%90%D1%85%D0%B5%D0%BB%D0%BE%D0%B9.jpg",
                imageAlt: "[Битката при Ахелой]",
                source: "„Костите на падналите ромеи се виждат и днес.“",
                options: [
                    { text: "Водя лично атаката на конницата.", impacts: { military: 40, culture: 0, stability: 15 }, feedback: "Най-великата победа в историята ни!" },
                    { text: "Изчаквамъ в защитна позиция.", impacts: { military: 15, culture: 0, stability: 5 }, feedback: "Побеждавате, но с много жертви." }
                ]
            },
            {
                year: "919 г.", title: "Блясъкътъ на Преславъ",
                description: "Столицата трябва да покаже мощта на държавата. Какво ще строите?",
                imageUrl: "https://www.forum.bg-nacionalisti.org/gallery/65_11_01_11_2_17_03.jpeg",
                imageAlt: "[Златната църква]",
                source: "„Който влезе в Преслав, губи ума си от красота.“",
                options: [
                    { text: "Строя Златната църква и школи.", impacts: { military: -10, culture: 50, stability: 10 }, feedback: "Преслав става културен център на света." },
                    { text: "Строя нови крепостни стени.", impacts: { military: 25, culture: -15, stability: 15 }, feedback: "Градът е непревземаем." }
                ]
            },
            {
                year: "921 г.", title: "Независима Патриаршия",
                description: "Българската църква трябва да е напълно равна на византийската.",
                imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROq8GN3zLIEP6PWdV7udvLm-vgMXptmhzowA&s",
                imageAlt: "[Църквата в Преслав]",
                source: "„Българската църква е първа среди славяните.“",
                options: [
                    { text: "Обявявамъ автокефална Патриаршия.", impacts: { military: -5, culture: 30, stability: 25 }, feedback: "Духовна победа!" },
                    { text: "Изчаквамъ признание отъ Римъ.", impacts: { military: 0, culture: 5, stability: -5 }, feedback: "Политически интриги бавят развитието." }
                ]
            },
            {
                year: "923 г.", title: "Срещата на Космосъ",
                description: "Срещате се с Роман Лакапин. Той ви моли за мир пред стените на града му.",
                imageUrl: "https://istorianasveta.eu/images/balg_srednovekovie/640px-RadzivillChronicleFol21rb.jpg",
                imageAlt: "[Среща на Симеон с Роман Лакапин]",
                source: "„Чух, че си много учен... защо искаш кръв?“",
                options: [
                    { text: "Поставямъ сурови условия за миръ.", impacts: { military: 10, culture: 5, stability: 20 }, feedback: "Вие сте пълновластен господар на Балканите." },
                    { text: "Продължавамъ войната докрай.", impacts: { military: 15, culture: -10, stability: -20 }, feedback: "Армията е уморена. Народът роптае." }
                ]
            },
            {
                year: "924 г.", title: "Сръбскиятъ въпросъ",
                description: "Сърбия предава България отново. Трябва да защитите тила си.",
                imageUrl: "https://conservative.bg/wp-content/uploads/2020/05/simeon1.jpg",
                imageAlt: "[Симеон Велики]",
                source: "„Сърбия бе превърната в българска провинция.“",
                options: [
                    { text: "Анексирамъ Сърбия къмъ България.", impacts: { military: 15, culture: -5, stability: 15 }, feedback: "Границите са подсигурени." },
                    { text: "Поставямъ свой васаленъ князъ.", impacts: { military: 5, culture: 0, stability: -10 }, feedback: "Той ви предава веднага." }
                ]
            },
            {
                year: "926 г.", title: "Хърватскиятъ походъ",
                description: "Войските ви навлизат в планините срещу хърватите. Рискът е голям.",
                imageUrl: "https://webnews.bg/uploads/images/95/5795/25795/orig.jpg?_=1446930490",
                imageAlt: "[Войници]",
                source: "„Това бе единственото поражение на Симеон.“",
                options: [
                    { text: "Търся миръ чрезъ Папата.", impacts: { military: -10, culture: 15, stability: 20 }, feedback: "Спестявате сили на армията." },
                    { text: "Атакувамъ презъ проходите.", impacts: { military: -30, culture: 0, stability: -15 }, feedback: "Тежко поражение." }
                ]
            },
            {
                year: "927 г.", title: "Заветътъ на Златния векъ",
                description: "Чувствате края си. Какво ще оставите на своя наследник Петър?",
                imageUrl: "https://www.helios-as.com/wp-content/uploads/2023/11/IMG_3035.jpg",
                imageAlt: "[Книжовници]",
                source: "„Симеон беше велик в победите и по-велик в книгите.“",
                options: [
                    { text: "Оставямъ държавата на книжовниците.", impacts: { military: -10, culture: 50, stability: 15 }, feedback: "Златният век ще свети векове наред." },
                    { text: "Оставямъ държавата на генералите.", impacts: { military: 30, culture: -20, stability: 10 }, feedback: "България остава военна сила." }
                ]
            }
        ];

        let playerName = '';
        let currentStep = 0;
        let scores = { military: 50, culture: 50, stability: 50 };

        const contentDiv = document.getElementById('content');
        const playerDisplay = document.getElementById('player-display');

        function renderMenu() {
            contentDiv.innerHTML = `
                <div class="map-bg h-full w-full flex flex-col items-center justify-center p-6 text-center fade-in">
                    <div class="bg-[#f4e4bc]/95 backdrop-blur-sm p-8 sm:p-12 rounded-xl shadow-2xl border-4 border-[#8b4513] max-w-lg w-full medieval-border">
                        <h2 class="text-4xl font-bold mb-4 serif text-[#2d1b10] border-b-2 border-[#8b4513] pb-2">Симеонъ Велики</h2>
                        <p class="text-gray-800 mb-8 italic font-bold text-lg">Ще поведете ли България към нейната вечна слава?</p>
                        <form id="start-form" class="space-y-4">
                            <input id="name-input" type="text" required placeholder="Вашето Име..." class="w-full px-4 py-4 rounded-lg border-2 border-[#8b4513] bg-[#fffaf0] outline-none text-center font-bold text-xl text-[#3d2b1f]">
                            <button type="submit" class="w-full bg-[#8b4513] text-[#f4e4bc] font-black py-5 rounded-lg shadow-xl hover:bg-[#2d1b10] transition-all uppercase tracking-[0.2em] text-lg">ЗАПОЧНИ ХРОНИКАТА</button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('start-form').onsubmit = (e) => {
                e.preventDefault();
                const input = document.getElementById('name-input');
                if(input.value.trim()) {
                    playerName = input.value.trim();
                    startGame();
                }
            };
        }

        function startGame() {
            playerDisplay.innerText = `ВЛАСТВАНЕ НА: ЦАРЪ ${playerName}`;
            playerDisplay.classList.remove('hidden');
            currentStep = 0;
            scores = { military: 50, culture: 50, stability: 50 };
            renderStep();
        }

        function renderScoreBoard() {
            return `
                <div class="bg-[#2d1b10] p-4 rounded-lg shadow-xl mb-6 grid grid-cols-1 md:grid-cols-3 gap-4 border-2 border-[#d4af37] shrink-0">
                    <div class="flex flex-col">
                        <div class="flex justify-between text-[11px] font-black text-amber-100 uppercase mb-1">
                            <span>⚔️ Военна Мощъ</span>
                            <span class="text-[#d4af37]">${scores.military}%</span>
                        </div>
                        <div class="w-full bg-black rounded-full h-2 overflow-hidden border border-[#8b4513]">
                            <div class="h-full bg-red-800 transition-all duration-500" style="width: ${scores.military}%"></div>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <div class="flex justify-between text-[11px] font-black text-amber-100 uppercase mb-1">
                            <span>📜 Книжовностъ</span>
                            <span class="text-[#d4af37]">${scores.culture}%</span>
                        </div>
                        <div class="w-full bg-black rounded-full h-2 overflow-hidden border border-[#8b4513]">
                            <div class="h-full bg-amber-500 transition-all duration-500" style="width: ${scores.culture}%"></div>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <div class="flex justify-between text-[11px] font-black text-amber-100 uppercase mb-1">
                            <span>🏛️ Стабилностъ</span>
                            <span class="text-[#d4af37]">${scores.stability}%</span>
                        </div>
                        <div class="w-full bg-black rounded-full h-2 overflow-hidden border border-[#8b4513]">
                            <div class="h-full bg-emerald-700 transition-all duration-500" style="width: ${scores.stability}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStep() {
            const step = CASES[currentStep];
            contentDiv.innerHTML = `
                <div class="fade-in p-4 sm:p-8">
                    ${renderScoreBoard()}
                    
                    <div class="flex justify-between items-center mb-4 border-b-2 border-[#8b4513] pb-2">
                        <span class="text-xs font-black bg-[#8b4513] text-[#f4e4bc] px-4 py-1 rounded border border-black uppercase">КАЗУСЪ ${currentStep + 1} / 12</span>
                        <span class="text-lg font-bold text-[#2d1b10] serif">${step.year}</span>
                    </div>

                    <h2 class="text-2xl sm:text-3xl font-bold text-[#1a0f0a] mb-6 serif leading-tight underline decoration-[#d4af37] decoration-4">${step.title}</h2>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-6">
                        <div class="space-y-4">
                            <div class="rounded overflow-hidden border-8 border-[#3d2b1f] shadow-[10px_10px_0px_#8b4513] h-56 sm:h-72">
                                <img src="${step.imageUrl}" alt="${step.imageAlt}" class="portrait-img">
                            </div>
                            <div class="bg-[#2d1b10] p-4 rounded-lg border-l-8 border-[#d4af37] italic text-sm text-[#f4e4bc]">
                                „${step.source}“
                            </div>
                        </div>
                        <div class="flex flex-col justify-between space-y-6">
                            <div class="bg-[#fffaf0]/60 p-6 rounded-lg border-2 border-dashed border-[#8b4513] text-[#1a0f0a] leading-relaxed text-lg font-medium shadow-inner">
                                ${step.description}
                            </div>
                            <div class="space-y-4">
                                ${step.options.map((opt, idx) => `
                                    <button onclick="handleOption(${idx})" class="option-btn w-full text-left p-5 rounded-lg shadow-md flex items-center gap-4 group">
                                        <span class="w-10 h-10 rounded bg-[#2d1b10] text-[#d4af37] flex items-center justify-center shrink-0 font-bold border-2 border-[#d4af37] text-xl">${idx + 1}</span>
                                        <span class="font-bold text-base sm:text-lg">${opt.text}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            contentDiv.scrollTo(0,0);
        }

        window.handleOption = (idx) => {
            const option = CASES[currentStep].options[idx];
            scores.military = Math.max(0, Math.min(100, scores.military + option.impacts.military));
            scores.culture = Math.max(0, Math.min(100, scores.culture + option.impacts.culture));
            scores.stability = Math.max(0, Math.min(100, scores.stability + option.impacts.stability));

            contentDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full fade-in p-4 sm:p-8">
                    ${renderScoreBoard()}
                    <div class="feedback-card w-full max-w-xl p-10 rounded-lg text-center shadow-2xl border-8 border-double border-[#d4af37]">
                        <h3 class="text-[#d4af37] text-xs font-black uppercase tracking-[0.4em] mb-6 border-b border-[#d4af37] pb-2">Последици за Царството</h3>
                        <p class="text-white text-xl sm:text-2xl serif italic leading-relaxed mb-12">
                            „${option.feedback}“
                        </p>
                        <button onclick="nextStep()" class="bg-[#d4af37] text-[#1a0f0a] font-black w-full py-6 rounded-lg shadow-[0_6px_0_#8b4513] transition-all text-xl uppercase tracking-[0.2em] active:translate-y-1 active:shadow-none">
                            Продължи напредъ ➔
                        </button>
                    </div>
                </div>
            `;
        };

        window.nextStep = () => {
            currentStep++;
            if (currentStep < CASES.length) {
                renderStep();
            } else {
                renderFinal();
            }
        };

        function downloadResult() {
            let finalRank = getRank().name;
            const text = `
ХРОНИКА НА ЗЛАТНИЯ ВЕК
----------------------------------------
ГОСУДАР: ЦАР ${playerName.toUpperCase()}
ИСТОРИЯТА ЩЕ ВИ ПОМНИ КАТО: ${finalRank.toUpperCase()}

ВАШИТЕ ПОСТИЖЕНИЯ:
- ВОЕННА МОЩ: ${scores.military}%
- КУЛТУРА: ${scores.culture}%
- СТАБИЛНОСТ: ${scores.stability}%

БЪЛГАРИЯ, ЛЕТО 927 Г.
----------------------------------------
            `;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Hronika_Simeon_${playerName}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function getRank() {
            if (scores.military > 75 && scores.culture > 75) return { name: "Царъ Симеонъ Велики", color: "text-[#d4af37]" };
            if (scores.culture > 70) return { name: "Царъ Книжовникъ", color: "text-amber-700" };
            if (scores.military > 70) return { name: "Царъ Воинъ", color: "text-red-800" };
            return { name: "Достоенъ Владетелъ", color: "text-[#8b4513]" };
        }

        function renderFinal() {
            let rankInfo = getRank();
            contentDiv.innerHTML = `
                <div class="map-bg h-full w-full flex flex-col items-center justify-center p-6 text-center fade-in">
                    <div class="bg-[#f4e4bc]/95 p-10 rounded shadow-2xl w-full max-w-2xl border-[12px] border-double border-[#8b4513]">
                        <p class="text-xs font-black text-[#8b4513] uppercase mb-2">За вечни времена ще бъдете:</p>
                        <h3 class="text-4xl sm:text-6xl font-black mb-6 serif ${rankInfo.color}">${rankInfo.name}</h3>
                        <p class="text-2xl italic text-slate-800 mb-10 font-bold">Царъ ${playerName}</p>
                        
                        <div class="mb-10">${renderScoreBoard()}</div>

                        <div class="flex flex-col sm:flex-row gap-6 justify-center">
                            <button onclick="downloadResult()" class="bg-emerald-700 text-white px-8 py-5 rounded-lg font-black shadow-lg uppercase text-sm border-b-4 border-emerald-900 active:scale-95">
                                💾 Изтегли Грамота
                            </button>
                            <button onclick="renderMenu()" class="bg-[#8b4513] text-[#f4e4bc] px-8 py-5 rounded-lg font-black shadow-lg uppercase text-sm border-b-4 border-black active:scale-95">
                                Нова ера
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        renderMenu();
    </script>
</body>
</html>
